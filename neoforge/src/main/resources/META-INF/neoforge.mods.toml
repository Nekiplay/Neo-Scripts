modLoader="kotlinforforge" #mandatory
loaderVersion="${neo_loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
logoFile = "assets/neoscripts/logo.png"

description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
# Путь указан относительно корня JAR файла мода
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]] #optional
modId="neoforge" #mandatory
type="required" #mandatory
versionRange="${neo_loader_version_range}" #mandatory
ordering="NONE"
side="BOTH"
[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${mc_versions_neo}"
ordering="NONE"
side="BOTH"
