name: Release

on:
  workflow_dispatch:
    push:
    pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Build
        run: ./gradlew build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            ./build/libs/*.jar
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: |
            ./build/libs/*.jar
